name: CI

# Runs the checks docs/testing.md describes, so they stop depending on someone
# remembering to run them locally. Matches the Dockerfile's Node 22.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Throwaway database for the DB-backed integration tests. The credentials
        # are deliberately the placeholders from .env.test.example — this server
        # lives and dies with the job and holds no real data.
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: myfamilyexpenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # tests/helpers/test-database.ts refuses to run unless these two are
      # byte-for-byte identical and the database name clearly names a test
      # database. Keep them in sync if you touch either.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/myfamilyexpenses_test?schema=public
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/myfamilyexpenses_test?schema=public
      # The app validates this at boot; any build-time code path needs a value
      # that passes the >=32-character check in lib/auth/session-secret.ts.
      SESSION_SECRET: ci-session-secret-not-used-for-anything-real
      OCR_PROVIDER: tesseract
      OCR_STRATEGY: single
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the Prisma client. Everything after this needs it, including
      # typecheck: next-env.d.ts is gitignored and the client is not in the repo.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Creates the database if missing and applies every migration. Run through
      # tsx directly rather than `npm run test:db:setup`, which expects a local
      # dotenv file that does not exist in CI.
      - name: Provision test database
        run: npx tsx prisma/setup-test-db.ts

      - name: Test
        run: npm test

      # The deploy builds the image, so a build break should fail here first.
      - name: Build
        run: npm run build
